name: eval-full

# Full 40-ticket evaluation on a free GitHub-hosted runner (4 vCPU, 16 GB, CPU only).
# Run manually: gh workflow run eval-full.yml
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/ai-service/requirements.txt }
      - run: pip install -r services/ai-service/requirements.txt
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 2; done
          ollama pull qwen2.5:3b
          ollama pull nomic-embed-text
      - name: Run full eval
        env:
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_MODEL: qwen2.5:3b
          EMBED_MODEL: nomic-embed-text
          LLM_TIMEOUT_S: "300"
          WEBHOOK_SECRET: ci-eval-secret
        run: python evals/run_eval.py --out evals/results/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-full, path: evals/results/ }
