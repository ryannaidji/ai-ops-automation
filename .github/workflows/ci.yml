name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/ai-service/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  eval:
    # Real local models on the runner (free, no API keys): Ollama + qwen2.5:3b + nomic-embed-text.
    needs: [python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/ai-service/requirements.txt }
      - run: pip install -r services/ai-service/requirements.txt
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 2; done
          ollama pull qwen2.5:3b
          ollama pull nomic-embed-text
      - name: Run eval subset
        env:
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_MODEL: qwen2.5:3b
          EMBED_MODEL: nomic-embed-text
          LLM_TIMEOUT_S: "300"
        run: python evals/run_eval.py --limit 12 --thresholds evals/thresholds-ci.json --out evals/results/ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: evals/results/ }
